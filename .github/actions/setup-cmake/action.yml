name: Set up a pinned CMake
description: >-
  Downloads one CMake release from Kitware, checks it against the release's published SHA-256 list,
  and puts it first on the PATH, so a build reads the same CMake on every runner whatever the image ships.

inputs:
  version:
    description: The CMake release to install, as x.y.z
    required: true

runs:
  using: composite
  steps:
    - name: Install CMake
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) package="cmake-$VERSION-linux-x86_64"; archive="$package.tar.gz"; bin="$package/bin" ;;
          Linux-ARM64) package="cmake-$VERSION-linux-aarch64"; archive="$package.tar.gz"; bin="$package/bin" ;;
          macOS-*) package="cmake-$VERSION-macos-universal"; archive="$package.tar.gz"; bin="$package/CMake.app/Contents/bin" ;;
          Windows-X64) package="cmake-$VERSION-windows-x86_64"; archive="$package.zip"; bin="$package/bin" ;;
          Windows-ARM64) package="cmake-$VERSION-windows-arm64"; archive="$package.zip"; bin="$package/bin" ;;
          *) echo "::error::no CMake package is known for $RUNNER_OS on $RUNNER_ARCH."; exit 1 ;;
        esac

        destination="$RUNNER_TEMP/cmake-$VERSION"
        mkdir -p "$destination"
        cd "$destination"
        release="https://github.com/Kitware/CMake/releases/download/v$VERSION"
        curl -sSfL --retry 3 -o "$archive" "$release/$archive"
        curl -sSfL --retry 3 -o checksums.txt "$release/cmake-$VERSION-SHA-256.txt"

        expected=$(awk -v name="$archive" '$2 == name { print $1 }' checksums.txt)
        if [ -z "$expected" ]; then
          echo "::error::cmake-$VERSION-SHA-256.txt lists no $archive."
          exit 1
        fi
        if command -v sha256sum > /dev/null; then
          actual=$(sha256sum "$archive" | awk '{ print $1 }')
        else
          actual=$(shasum -a 256 "$archive" | awk '{ print $1 }')
        fi
        if [ "$actual" != "$expected" ]; then
          echo "::error::$archive hashes to $actual, and the release lists $expected."
          exit 1
        fi

        case "$archive" in
          *.zip) 7z x -y "$archive" > /dev/null ;;
          *) tar -xzf "$archive" ;;
        esac

        reported=$("$destination/$bin/cmake" --version | head -n 1)
        if [ "$reported" != "cmake version $VERSION" ]; then
          echo "::error::the installed CMake reports '$reported', not $VERSION."
          exit 1
        fi

        path_entry="$destination/$bin"
        if [ "$RUNNER_OS" = "Windows" ]; then
          path_entry=$(cygpath -w "$path_entry")
        fi
        echo "$path_entry" >> "$GITHUB_PATH"
        echo "$reported, from $path_entry"

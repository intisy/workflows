name: Check out sibling repositories
description: >-
  Clones further repositories a build or test reads beside the primary checkout, one per line as
  "owner/name path [ref]", into the given path inside the workspace.

inputs:
  repositories:
    description: One "owner/name path [ref]" per line, the ref a branch, a tag or a full commit SHA; an empty ref takes the repository's default branch
    required: true
  token:
    description: Token the clones authenticate with
    required: true

runs:
  using: composite
  steps:
    - name: Clone each sibling
      shell: bash
      env:
        SIBLINGS: ${{ inputs.repositories }}
        TOKEN: ${{ inputs.token }}
      run: |
        while read -r repository path ref; do
          [ -z "$repository" ] && continue
          if [ -z "$path" ]; then
            echo "::error::'$repository' needs a path, otherwise it would overwrite the primary checkout."
            exit 1
          fi
          url="https://x-access-token:${TOKEN}@github.com/${repository}.git"
          # clone --branch takes a branch or a tag and never a commit, so a pinned SHA is checked out after a full clone.
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            git clone "$url" "$path"
            git -C "$path" checkout --quiet "$ref"
            git -C "$path" submodule update --init --recursive
          else
            git clone --recurse-submodules ${ref:+--branch "$ref"} "$url" "$path"
          fi
        done <<< "$SIBLINGS"

name: GitHub pre-release

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: 'The tag prefix that releases to GitHub only, e.g. "gh-" (empty is the npm-publishing prefix)'
        required: true
        type: string
      patch_ceiling:
        description: 'The patch number at or above which a release tag is refused'
        required: true
        type: number
      needs_java:
        description: 'Whether the build needs a JDK (a TeaVM provider/translator resolving ai-java from GitHub Packages)'
        required: false
        type: boolean
        default: false

# No permissions block: a called workflow's GITHUB_TOKEN permissions can only be downgraded, never
# elevated, from what the caller's job grants (GitHub Actions docs, "Reusing workflow configurations":
# "The GITHUB_TOKEN permissions passed from the caller workflow can be only downgraded (not elevated)
# by the called workflow"), and declaring none here means the caller's own grant (contents: write,
# plus packages: read when needs_java) applies unchanged (Ken Muse, "GitHub Actions Workflow
# Permissions": "If the reusable workflow does not declare any permissions, it will default to the
# permissions provided by the job or workflow").

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against runaway patch versions
        run: |
          PATCH="${GITHUB_REF_NAME##*.}"
          if [ "${PATCH:-0}" -ge ${{ inputs.patch_ceiling }} ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} has patch >= ${{ inputs.patch_ceiling }}, bump the minor version (reset patch) instead of more patches."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        if: ${{ inputs.needs_java }}
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: npm install

      - name: Build
        if: ${{ inputs.needs_java }}
        run: npm run build
        env:
          # The Gradle build resolves io.github.intisy:ai-java from GitHub Packages Maven
          # (intisy-ai/ai-java). GitHub Packages needs a token even for public packages;
          # ai-java's package is public, so the job's github.token (packages: read) reads it.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

      - name: Build
        if: ${{ !inputs.needs_java }}
        run: npm run build

      - run: git diff --exit-code -- README.md
      - run: npx vitest run

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#${{ inputs.tag_prefix }}v}"
          npm version "$VERSION" --allow-same-version --no-git-tag-version

      # The directory is created first: --pack-destination does not create it, and npm fails with
      # ENOENT on the tarball it was about to write.
      - run: mkdir -p release-asset && npm pack --pack-destination release-asset

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-asset/*.tgz --prerelease --title "$GITHUB_REF_NAME" --generate-notes

name: GitHub pre-release

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: 'The tag prefix that releases to GitHub only, e.g. "gh-" (empty is the npm-publishing prefix)'
        required: true
        type: string
      patch_ceiling:
        description: 'The patch number at or above which a release tag is refused'
        required: true
        type: number
      needs_java:
        description: 'Whether the build needs a JDK'
        required: false
        type: boolean
        default: false

# No permissions block: a called workflow can only downgrade the caller's GITHUB_TOKEN grant, so
# declaring none leaves the caller's own grant in force.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against runaway patch versions
        run: |
          PATCH="${GITHUB_REF_NAME##*.}"
          if [ "${PATCH:-0}" -ge ${{ inputs.patch_ceiling }} ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} has patch >= ${{ inputs.patch_ceiling }}, bump the minor version (reset patch) instead of more patches."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        if: ${{ inputs.needs_java }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Build with a JDK
        if: ${{ inputs.needs_java }}
        run: npm run build
        env:
          # GitHub Packages Maven demands a token even for a public package.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

      - name: Build
        if: ${{ !inputs.needs_java }}
        run: npm run build

      - name: Check the README is up to date
        run: git diff --exit-code -- README.md

      - name: Run tests
        run: npx vitest run

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#${{ inputs.tag_prefix }}v}"
          npm version "$VERSION" --allow-same-version --no-git-tag-version

      - name: Pack the tarball
        # npm pack does not create the destination and fails with ENOENT on the tarball it writes.
        run: mkdir -p release-asset && npm pack --pack-destination release-asset

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-asset/*.tgz --prerelease --title "$GITHUB_REF_NAME" --generate-notes

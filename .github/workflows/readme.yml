name: Generate README

on:
  workflow_call:
    inputs:
      repository:
        description: 'owner/name of the repository to document'
        required: false
        type: string
        default: ${{ github.repository }}
      default_branch:
        description: 'branch the README is generated on and committed to'
        required: false
        type: string
        default: ${{ github.event.repository.default_branch }}
      tag:
        description: 'release tag to document; falls back to the latest matching tag'
        required: false
        type: string
        default: ''
      workflows_ref:
        description: 'ref of the shared workflows repo to take the generator from'
        required: false
        type: string
        default: ''
      node_version:
        description: 'Node.js version used by the npm generator'
        required: false
        type: string
        default: '20'
      commit_message:
        required: false
        type: string
        default: 'docs: auto-generate README.md [skip ci]'
    secrets:
      envPAT:
        required: false

jobs:
  readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default_branch }}
          submodules: recursive
          token: ${{ secrets.envPAT || github.token }}

      - name: Select generator
        id: select
        run: |
          if [ -f .github/docs-config.yml ]; then
            echo "generator=python" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "generator=npm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No README spec: add .github/docs-config.yml, or a defineReadme() spec to a core-based npm package."
            exit 1
          fi

      - name: Fetch the shared generator
        if: steps.select.outputs.generator == 'python'
        uses: actions/checkout@v4
        with:
          repository: intisy/workflows
          ref: ${{ inputs.workflows_ref }}
          path: .readme-generator

      - uses: actions/setup-python@v5
        if: steps.select.outputs.generator == 'python'
        with:
          python-version: '3.x'

      - name: Generate README.md from docs-config.yml
        if: steps.select.outputs.generator == 'python'
        env:
          GITHUB_TOKEN: ${{ secrets.envPAT || github.token }}
          README_TAG: ${{ inputs.tag }}
        run: |
          python3 .readme-generator/.github/scripts/generate-readme.py --repository "${{ inputs.repository }}"
          rm -rf .readme-generator

      - uses: actions/setup-node@v4
        if: steps.select.outputs.generator == 'npm'
        with:
          node-version: ${{ inputs.node_version }}

      - name: Generate README.md from the plugin's readme spec
        if: steps.select.outputs.generator == 'npm'
        run: |
          npm install
          npm run build
          node "$(node -p "require.resolve('.')")" readme

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: ${{ inputs.commit_message }}
          # --force so a repo that gitignores its generated README (to keep the template branch
          # free of one) can still have it committed by the one workflow allowed to produce it.
          add: 'README.md --force'
          default_author: github_actions

name: Generate README

on:
  workflow_call:
    inputs:
      repository:
        description: 'owner/name of the repository to document'
        required: false
        type: string
        default: ${{ github.repository }}
      default_branch:
        description: 'Branch the README is generated on and committed to'
        required: false
        type: string
        default: ${{ github.event.repository.default_branch }}
      tag:
        description: 'Release tag to document; falls back to the latest matching tag'
        required: false
        type: string
        default: ''
      generator_repository:
        description: 'owner/name of the repository hosting the README generator script'
        required: false
        type: string
        default: 'intisy/workflows'
      workflows_ref:
        description: 'Ref of the generator repository to take the script from'
        required: false
        type: string
        default: ''
      node_version:
        description: 'Node.js version used by the npm generator'
        required: false
        type: string
        default: '20'
      commit_message:
        description: 'Commit message for the generated README'
        required: false
        type: string
        default: 'docs: auto-generate README.md [skip ci]'
    secrets:
      envPAT:
        required: false

jobs:
  readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default_branch }}
          submodules: recursive
          token: ${{ secrets.envPAT || github.token }}

      - name: Select generator
        id: select
        run: |
          if [ -f .github/docs-config.yml ]; then
            echo "generator=python" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "generator=npm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No README spec: add .github/docs-config.yml, or a defineReadme() spec to a core-based npm package."
            exit 1
          fi

      - name: Fetch the shared generator
        if: steps.select.outputs.generator == 'python'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.generator_repository }}
          ref: ${{ inputs.workflows_ref }}
          path: .readme-generator

      - name: Setup Python
        if: steps.select.outputs.generator == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate README.md from docs-config.yml
        if: steps.select.outputs.generator == 'python'
        env:
          GITHUB_TOKEN: ${{ secrets.envPAT || github.token }}
          README_TAG: ${{ inputs.tag }}
          README_DEFAULT_BRANCH: ${{ inputs.default_branch }}
        run: |
          python3 .readme-generator/.github/scripts/generate-readme.py --repository "${{ inputs.repository }}"
          rm -rf .readme-generator

      - name: Setup Node.js
        if: steps.select.outputs.generator == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # The npm generator renders the README from the BUILT package, and several of these repos drive
      # Gradle and TeaVM from npm run build, so the JDK has to be here or the render fails on them.
      - name: Detect toolchains
        if: steps.select.outputs.generator == 'npm'
        id: detect
        uses: intisy/workflows/.github/actions/detect-toolchains@main

      - name: Setup Java
        if: ${{ steps.select.outputs.generator == 'npm' && steps.detect.outputs.gradle_root != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: ${{ steps.select.outputs.generator == 'npm' && steps.detect.outputs.gradle_root != '' }}
        run: chmod +x ${{ steps.detect.outputs.gradle_root }}/gradlew || true

      - name: Generate README.md from the plugin's readme spec
        if: steps.select.outputs.generator == 'npm'
        run: |
          npm install
          npm run build
          node "$(node -p "require.resolve('.')")" readme

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: ${{ inputs.commit_message }}
          # --force so a repo that gitignores its generated README can still have it committed by
          # the one workflow allowed to produce it.
          add: 'README.md --force'
          default_author: github_actions

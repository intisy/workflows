name: Publish to npm

on:
  workflow_call:
    inputs:
      unscoped_name:
        description: 'The package name published to npm'
        required: true
        type: string
      tag:
        description: 'Release tag the version is taken from; empty takes the ref the run was started from'
        required: false
        type: string
        default: ''
      scope:
        description: 'npm scope to also publish under, without the leading @; empty skips the scoped publish'
        required: false
        type: string
        default: ''
      scoped_only:
        description: 'Publish only under the scope; the unscoped name is unavailable on npm'
        required: false
        type: boolean
        default: false
      patch_ceiling:
        description: 'The patch number at or above which a release tag is refused'
        required: true
        type: number
      needs_java:
        description: 'Whether the build needs a JDK'
        required: false
        type: boolean
        default: false
      jar_module:
        description: 'Whitespace-separated Gradle modules to jar-publish, e.g. "routing proxy-contracts" (no leading colon); empty to skip'
        required: false
        type: string
        default: ''
      jar_pretest_task:
        description: 'Gradle task to run before the jar publish, e.g. "claude-code-proxy-plugin:test"; empty to skip'
        required: false
        type: string
        default: ''

# A called workflow can only downgrade the caller's GITHUB_TOKEN grant, so contents/packages are each
# caller's alone to declare; only id-token, which every caller grants, is safe to pin here.
permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against a publish that would produce nothing
        if: ${{ inputs.scoped_only && inputs.scope == '' }}
        run: |
          echo "::error::scoped_only needs a scope, otherwise nothing is published."
          exit 1

      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: echo "name=${TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Guard against runaway patch versions
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          PATCH="${TAG##*.}"
          if [ "${PATCH:-0}" -ge ${{ inputs.patch_ceiling }} ]; then
            echo "::error::Tag ${TAG} has patch >= ${{ inputs.patch_ceiling }}, bump the minor version (reset patch) instead of more patches."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Setup Java
        if: ${{ inputs.needs_java }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Build with a JDK
        if: ${{ inputs.needs_java }}
        run: npm run build
        env:
          # GitHub Packages Maven demands a token even for a public package.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

      - name: Build
        if: ${{ !inputs.needs_java }}
        run: npm run build

      - name: Check the README is up to date
        run: git diff --exit-code -- README.md

      - name: Run tests
        run: npx vitest run

      # A file: dependency cannot resolve from a published tarball, so each one is pinned to the
      # version its submodule carries: an npm consumer then installs a library at least as new as
      # the one this artifact was compiled against.
      - name: Pin file dependencies to published versions
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const deps = pkg.dependencies || {};
          let changed = 0;
          for (const [name, spec] of Object.entries(deps)) {
            if (!String(spec).startsWith("file:")) continue;
            const { version } = JSON.parse(fs.readFileSync(String(spec).slice(5) + "/package.json", "utf8"));
            if (!version) throw new Error(name + " declares no version to pin");
            deps[name] = "^" + version;
            changed++;
            console.log(name + " -> ^" + version);
          }
          if (changed) fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Set version from tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${TAG#v}"
          npm version "$VERSION" --allow-same-version --no-git-tag-version

      - name: Publish unscoped
        if: ${{ !inputs.scoped_only }}
        run: npm publish --access public

      - name: Publish scoped
        if: ${{ inputs.scope != '' }}
        run: |
          npm pkg set name="@${{ inputs.scope }}/${{ inputs.unscoped_name }}"
          npm publish --access public

      - name: Grant execute permission for gradlew
        if: ${{ inputs.jar_module != '' }}
        run: chmod +x java/gradlew

      - name: Run the jar's pretest task
        if: ${{ inputs.jar_module != '' && inputs.jar_pretest_task != '' }}
        working-directory: java
        run: ./gradlew :${{ inputs.jar_pretest_task }}

      # One gradle invocation over every module, so a multi-module release uploads its assets to the
      # one release rather than racing several invocations to create it. A single module is just a
      # one-element list, so an existing caller passing one name is unaffected.
      - name: Publish jars
        if: ${{ inputs.jar_module != '' }}
        working-directory: java
        env:
          JAR_MODULES: ${{ inputs.jar_module }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TASKS=""
          for module in $JAR_MODULES; do
            TASKS="$TASKS :$module:jar :$module:publishGithub"
          done
          ./gradlew $TASKS -Partifact_version=${{ steps.tag.outputs.name }} -x test -x compileTestJava

name: Drift

# Runs a conformance kit's drift checks against the repository that calls it. The kit, its programs
# and their word, language and rule lists all live outside the repository under test, so no
# repository decides how its own checks are run.
on:
  workflow_call:
    inputs:
      kit_repository:
        description: 'The conformance kit, as owner/name'
        required: true
        type: string
      kit_ref:
        description: 'Ref of the kit to run; empty takes its default branch'
        required: false
        type: string
        default: ''
      role:
        description: 'What the repository under test is, as the purity check reads it: c, core, kit, standard, or a language the kit lists'
        required: true
        type: string
      checks:
        description: 'Space separated subset of: purity names parity layers core-gate core-sources benchmark vectors'
        required: true
        type: string
      language:
        description: 'The language whose module layout and test root the parity and layers checks read; required for both'
        required: false
        type: string
        default: ''
      runners:
        description: 'JSON array of the runner labels the job fans out over'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      cmake_version:
        description: 'CMake release the kit is built with'
        required: false
        type: string
        default: '4.4.4'
      timeout_minutes:
        required: false
        type: number
        default: 30
    secrets:
      envPAT:
        description: 'Token used for checkouts; falls back to the job token'
        required: false

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Refuse a check list that cannot be run
        id: checks
        shell: bash
        env:
          CHECKS: ${{ inputs.checks }}
          ROLE: ${{ inputs.role }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          count=0
          for check in $CHECKS; do
            count=$((count + 1))
            case "$check" in
              purity|names) ;;
              parity)
                [ -n "$LANGUAGE" ] || { echo "::error::parity needs the language input."; exit 1; } ;;
              layers)
                case "$ROLE" in
                  core|standard|kit) echo "::error::layers reads a language implementation's tests, and this repository's role is '$ROLE'."; exit 1 ;;
                esac
                [ -n "$LANGUAGE" ] || { echo "::error::layers needs the language input."; exit 1; } ;;
              core-gate|core-sources|benchmark)
                [ "$ROLE" = "core" ] || { echo "::error::$check reads the core under test, and this repository's role is '$ROLE', not core."; exit 1; } ;;
              vectors)
                case "$ROLE" in
                  core|standard) ;;
                  *) echo "::error::vectors runs the corpus of the repository under test, and only core and standard have one; this repository's role is '$ROLE'."; exit 1 ;;
                esac ;;
              *)
                echo "::error::'$check' is not a drift check. Fix: use purity, names, parity, layers, core-gate, core-sources, benchmark or vectors."
                exit 1 ;;
            esac
          done
          [ "$count" -gt 0 ] || { echo "::error::the checks input names no check, so this run would check nothing."; exit 1; }
          echo "padded= $(printf '%s' "$CHECKS" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//') " >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.envPAT || github.token }}

      - name: Checkout the kit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: .drift-kit
          token: ${{ secrets.envPAT || github.token }}

      - name: Move the kit out of the workspace
        shell: bash
        run: |
          mv .drift-kit "$RUNNER_TEMP/drift-kit"
          echo "DRIFT_KIT=$RUNNER_TEMP/drift-kit" >> "$GITHUB_ENV"

      - name: Check out the dependencies the kit pins
        uses: intisy/workflows/.github/actions/checkout-dependencies@main
        with:
          token: ${{ secrets.envPAT || github.token }}
          root: ${{ runner.temp }}/drift-kit
          file: .weivel/repo.json

      - name: Build the kit against the repository under test
        shell: bash
        env:
          ROLE: ${{ inputs.role }}
        run: |
          set -euo pipefail
          swapped=false
          own_name=""
          if [ -f .weivel/repo.json ]; then
            own_name=$(jq -r '.importName // ""' .weivel/repo.json | tr -d '\r')
          fi
          kit_dependencies=$(jq -r '(.dependencies // [])[]
            | [.importName, (.path // ("siblings/" + .importName))] | join("|")' "$DRIFT_KIT/.weivel/repo.json" | tr -d '\r')
          while IFS='|' read -r name path; do
            [ -n "$name" ] || continue
            if [ "$name" = "$own_name" ]; then
              rm -rf "${DRIFT_KIT:?}/$path"
              cp -R "$GITHUB_WORKSPACE" "$DRIFT_KIT/$path"
              echo "The repository under test replaces the kit's pinned $name."
              swapped=true
            fi
            git -C "$DRIFT_KIT/$path" log -1 --format="The kit builds against $name %H"
          done <<< "$kit_dependencies"
          case "$ROLE" in
            core|standard)
              if [ "$swapped" != true ]; then
                echo "::error::role '$ROLE' must be checked against the code under test, but its importName '${own_name:-<none>}' is none of the kit's dependencies, so the kit would build against its own pinned copy. Fix: give the repository a .weivel/repo.json whose importName the kit's .weivel/repo.json lists, or point kit_ref at a kit commit that depends on it."
                exit 1
              fi ;;
          esac

      - name: Set up the pinned cmake
        uses: intisy/workflows/.github/actions/setup-cmake@main
        with:
          version: ${{ inputs.cmake_version }}

      - name: Build the kit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$DRIFT_KIT" -B "$DRIFT_KIT/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$DRIFT_KIT/build" --config Release --parallel
          programs="$DRIFT_KIT/build/bin"
          if [ -d "$programs/Release" ]; then
            programs="$programs/Release"
          fi
          echo "DRIFT_PROGRAMS=$programs" >> "$GITHUB_ENV"

      - name: Purity
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(steps.checks.outputs.padded, ' purity ') }}
        shell: bash
        env:
          ROLE: ${{ inputs.role }}
        run: '"$DRIFT_PROGRAMS/weivel-purity" "$GITHUB_WORKSPACE" "$ROLE" "$DRIFT_KIT/checks/languages.txt"'

      - name: Names
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(steps.checks.outputs.padded, ' names ') }}
        shell: bash
        run: '"$DRIFT_PROGRAMS/weivel-names" "$GITHUB_WORKSPACE" "$DRIFT_KIT/checks/names.txt"'

      - name: Parity
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(steps.checks.outputs.padded, ' parity ') }}
        shell: bash
        env:
          LANGUAGE: ${{ inputs.language }}
        run: '"$DRIFT_PROGRAMS/weivel-parity" "$GITHUB_WORKSPACE" "$DRIFT_KIT/siblings/core/MODULES" "$LANGUAGE" "$DRIFT_KIT/checks/languages.txt"'

      - name: Layers
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(steps.checks.outputs.padded, ' layers ') }}
        shell: bash
        env:
          LANGUAGE: ${{ inputs.language }}
        run: '"$DRIFT_PROGRAMS/weivel-layers" "$GITHUB_WORKSPACE" "$DRIFT_KIT/vectors/layer" "$LANGUAGE" "$DRIFT_KIT/checks/languages.txt"'

      - name: Core gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(steps.checks.outputs.padded, ' core-gate ') }}
        shell: bash
        run: ctest --test-dir "$DRIFT_KIT/build" -C Release -R '^core_reads_nothing_of_the_world$' --no-tests=error -V

      - name: Core sources
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(steps.checks.outputs.padded, ' core-sources ') }}
        shell: bash
        run: '"$DRIFT_PROGRAMS/weivel-core-gate" --sources "$DRIFT_KIT/checks/core_gate.txt" "$GITHUB_WORKSPACE"'

      - name: Benchmark
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(steps.checks.outputs.padded, ' benchmark ') }}
        shell: bash
        run: |
          set -euo pipefail
          "$DRIFT_PROGRAMS/weivel-benchmark-control-call" measure
          "$DRIFT_PROGRAMS/weivel-benchmark-control-call" gate "$DRIFT_KIT/benchmarks/budget.txt"

      - name: Vectors
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(steps.checks.outputs.padded, ' vectors ') }}
        shell: bash
        env:
          ROLE: ${{ inputs.role }}
        run: '"$DRIFT_PROGRAMS/weivel-conformance" run "$DRIFT_KIT/vectors/$ROLE"'

name: offload-run

on:
  workflow_call:
    inputs:
      env_prefix:
        description: 'Prefix identifying which caller vars and secrets to place in the container, e.g. PINAXIS_. The caller must also pass secrets: inherit, or no secrets will be forwarded even though vars still resolve.'
        required: true
        type: string
      job_name:
        description: 'Cloud job name; defaults to the calling repository name'
        required: false
        type: string
        default: ''
      workflows_ref:
        required: false
        type: string
        default: main

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Checkout workflows repo
        uses: actions/checkout@v4
        with:
          repository: intisy/workflows
          ref: ${{ inputs.workflows_ref }}
          path: .workflows

      - name: Build the container environment
        id: env
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          PREFIX: ${{ inputs.env_prefix }}
        run: |
          set -euo pipefail
          node .workflows/select-env.mjs "$PREFIX" ALL_VARS ALL_SECRETS > "$RUNNER_TEMP/offload-env"
          count=$(wc -l < "$RUNNER_TEMP/offload-env")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "no variables or secrets matched prefix '$PREFIX'; nothing to offload" >&2
            exit 1
          fi

      - name: Authenticate gcloud for cloud run
        if: contains(vars[format('{0}PROVIDERS', inputs.env_prefix)], 'cloudrun')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud for cloud run
        if: contains(vars[format('{0}PROVIDERS', inputs.env_prefix)], 'cloudrun')
        uses: google-github-actions/setup-gcloud@v2

      - name: Select provider and run
        env:
          PROVIDERS: ${{ vars[format('{0}PROVIDERS', inputs.env_prefix)] }}
          RUN_NUMBER: ${{ github.run_number }}
          OFFLOAD_JOB_NAME: ${{ inputs.job_name != '' && inputs.job_name || github.event.repository.name }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          export OFFLOAD_ENV_FILE="$RUNNER_TEMP/offload-env"
          order="$(bash .workflows/select-order "${PROVIDERS:-}" "${RUN_NUMBER:-0}")"
          if [ -z "$order" ]; then
            echo "no providers configured in ${{ inputs.env_prefix }}PROVIDERS; nothing to offload"
            exit 0
          fi
          failed=0
          while IFS= read -r provider; do
            [ -z "$provider" ] && continue
            script=".workflows/providers/${provider}.sh"
            if [ ! -f "$script" ]; then
              echo "provider '$provider' has no adapter at $script; skipping"
              failed=1
              continue
            fi
            echo "attempting provider: $provider"
            if bash "$script"; then
              echo "provider '$provider' succeeded"
              exit 0
            fi
            echo "provider '$provider' failed; trying next"
            failed=1
          done <<< "$order"
          if [ "$failed" -eq 1 ]; then
            echo "all enabled providers failed"
            exit 1
          fi

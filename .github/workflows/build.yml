name: Build And Upload

on:
  workflow_call:
    inputs:
      ref_name:
        description: 'Tag the build is versioned with and released under'
        required: true
        type: string
      java_version:
        description: 'Java version handed to actions/setup-java; ignored when jdk_distribution is liberica-full'
        required: false
        type: string
        default: '8'
      jdk_distribution:
        description: 'liberica-full installs BellSoft Liberica Full (bundled JavaFX) from bell-sw.com; any other value is handed to actions/setup-java'
        required: false
        type: string
        default: 'liberica-full'
      liberica_full_release:
        description: 'BellSoft Liberica Full release to install when jdk_distribution is liberica-full'
        required: false
        type: string
        default: '8u372+7'
    secrets:
      envPAT:
        required: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and install BellSoft Liberica JDK Full (with JavaFX)
        if: inputs.jdk_distribution == 'liberica-full'
        run: |
          release="${{ inputs.liberica_full_release }}"
          dir="jdk${release%%+*}-full"
          wget "https://download.bell-sw.com/java/${release}/bellsoft-jdk${release}-linux-amd64-full.tar.gz"
          tar -xzf "bellsoft-jdk${release}-linux-amd64-full.tar.gz"
          sudo mv "$dir" "/opt/bellsoft-$dir"
          echo "JAVA_HOME=/opt/bellsoft-$dir" >> $GITHUB_ENV
          echo "/opt/bellsoft-$dir/bin" >> $GITHUB_PATH

      - name: Setup Java
        if: inputs.jdk_distribution != 'liberica-full'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.jdk_distribution }}

      - name: Setup Git
        run: echo ${{ secrets.envPAT }} | gh auth login --with-token

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run build with Gradle Wrapper
        run: ./gradlew build -Partifact_version=${{ inputs.ref_name }}

      - name: Create release and upload the jars
        run: |
          gh release create ${{ inputs.ref_name }} -t "Release ${{ inputs.ref_name }}"
          gh release upload "${{ inputs.ref_name }}" build/libs/* --clobber

name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'

jobs:
  actions:
    uses: ./.github/workflows/test.yml
    with:
      toolchains: node
      node_build: ''

  scripts:
    uses: ./.github/workflows/python-tests.yml

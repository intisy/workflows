# This repository's own CI, not a reusable workflow. The self- prefix marks it as such: every
# other file here is called by other repositories, this one only ever runs on this one.
name: "Self: tests"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/actions/**'
      - '.github/self-test/**'
      - '.github/workflows/self-test.yml'
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/self-test/**'
      - '.github/workflows/self-test.yml'

jobs:
  actions:
    uses: ./.github/workflows/test.yml
    with:
      toolchains: node
      node_build: ''

  dependencies-valid:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the fixture's dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          token: ${{ github.token }}
          file: .github/self-test/valid/repo.json
      - name: Expect the dependency at its pinned commit
        shell: bash
        run: |
          test "$(git -C siblings/workflows rev-parse HEAD)" = 7698e1dec71ce0e070c9c3d20334ef9ef3f6de6f
          test -f siblings/workflows/.github/actions/checkout-siblings/action.yml
      - name: Expect no token left under the sibling's .git
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if grep -rqF -e "$TOKEN" -e x-access-token siblings/workflows/.git; then
            echo "::error::the token was persisted under siblings/workflows/.git"
            exit 1
          fi
          echo "no token under siblings/workflows/.git"

  siblings-no-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out a sibling with checkout-siblings
        uses: ./.github/actions/checkout-siblings
        with:
          repositories: intisy/workflows siblings/workflows 7698e1dec71ce0e070c9c3d20334ef9ef3f6de6f
          token: ${{ github.token }}
      - name: Expect the sibling and no token under its .git
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          test "$(git -C siblings/workflows rev-parse HEAD)" = 7698e1dec71ce0e070c9c3d20334ef9ef3f6de6f
          if grep -rqF -e "$TOKEN" -e x-access-token siblings/workflows/.git; then
            echo "::error::the token was persisted under siblings/workflows/.git"
            exit 1
          fi
          echo "no token under siblings/workflows/.git"

  dependencies-refused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: path-escape, refusal: path-escape }
          - { case: path-name-mismatch, refusal: path-name-mismatch }
          - { case: missing-id, refusal: id-not-found }
          - { case: claimed-twice, refusal: path-claimed-twice, extra_repositories: 'intisy/workflows siblings/workflows' }
          - { case: schema-failure, refusal: schema }
          - { case: foreign-resolver, refusal: foreign-resolver }
    steps:
      - uses: actions/checkout@v4
      - name: Check out the fixture's dependencies
        id: checkout
        continue-on-error: true
        uses: ./.github/actions/checkout-dependencies
        with:
          token: ${{ github.token }}
          file: .github/self-test/${{ matrix.case }}/repo.json
          extra_repositories: ${{ matrix.extra_repositories }}
      - name: Expect this refusal and nothing else
        shell: bash
        env:
          OUTCOME: ${{ steps.checkout.outcome }}
          EXPECTED: ${{ matrix.refusal }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected the checkout to be refused, it ended $OUTCOME"; exit 1; }
          actual=$(cat "$RUNNER_TEMP/checkout-dependencies.refusal" 2>/dev/null || echo none)
          [ "$actual" = "$EXPECTED" ] || { echo "::error::expected refusal '$EXPECTED', got '$actual'"; exit 1; }
          [ ! -e siblings ] || { echo "::error::a refused checkout left siblings/ behind"; exit 1; }

  setup-cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned cmake
        uses: ./.github/actions/setup-cmake
        with:
          version: 3.31.6
      - name: Expect it first on the PATH
        shell: bash
        run: |
          reported=$(cmake --version | head -n 1)
          [ "$reported" = "cmake version 3.31.6" ] || { echo "::error::cmake on the PATH reports '$reported'"; exit 1; }
          ctest --version | head -n 1

name: Merge

on:
  workflow_call:
    inputs:
      source:
        description: 'Branch merged from'
        required: true
        type: string
      target:
        description: 'Branch merged into'
        required: true
        type: string
      mode:
        description: 'merge for a normal merge, overwrite to take the source tree wholesale'
        required: false
        type: string
        default: 'merge'
      sync_back:
        description: 'Bring the target back onto the source afterwards, so the source never falls behind'
        required: false
        type: boolean
        default: false
      generated_paths:
        description: 'Newline separated file paths that always resolve to whichever branch is being merged into'
        required: false
        type: string
        default: 'README.md'
    secrets:
      envPAT:
        description: >-
          Token the push is made with; falls back to the job token, which cannot push to a protected
          branch. Do NOT pass a PAT when the caller triggers on a push to a branch sync_back also
          pushes to: the job token deliberately does not retrigger workflows, and a PAT does, which
          loops.
        required: false

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.envPAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge
        uses: intisy/workflows/.github/actions/merge-branches@main
        with:
          source: ${{ inputs.source }}
          target: ${{ inputs.target }}
          mode: ${{ inputs.mode }}
          sync_back: ${{ inputs.sync_back }}
          generated_paths: ${{ inputs.generated_paths }}
